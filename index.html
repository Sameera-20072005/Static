<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Glass Website</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    color: white;
    overflow-x: hidden;
}

/* ANIMATED BACKGROUND */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, #4facfe, #00f2fe, #43e97b, #fa709a);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
    z-index: -1;
}

@keyframes gradientMove {
    0% {transform: translate(0,0);}
    50% {transform: translate(-25%, -25%);}
    100% {transform: translate(0,0);}
}

/* NAVBAR */
header {
    position: fixed;
    width: 100%;
    backdrop-filter: blur(10px);
    background: rgba(0,0,0,0.3);
    z-index: 1000;
}

nav {
    display: flex;
    justify-content: space-between;
    padding: 15px 40px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #00f2fe;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.hero h1 {
    font-size: 50px;
}

.btn {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 25px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    cursor: pointer;
    transition: 0.3s;
    backdrop-filter: blur(5px);
}

.btn:hover {
    transform: scale(1.1);
    background: rgba(255,255,255,0.4);
}

/* GLASS CARD */
.card {
    margin: 40px auto;
    width: 80%;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    text-align: center;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-10px) scale(1.02);
}

/* ANIMATION */
.hidden {
    opacity: 0;
    transform: translateY(40px);
    transition: 1s;
}

.show {
    opacity: 1;
    transform: translateY(0);
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .hero h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<header>
    <nav>
        <div class="logo">GlassUI</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Features</a>
            <a href="#">Contact</a>
        </div>
    </nav>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hidden">
        <h1>Next-Gen Website Design</h1>
        <p>Glassmorphism + Animations</p>
        <button class="btn">Explore</button>
    </div>
</section>

<!-- CARDS -->
<div class="card hidden">
    <h2>Fast</h2>
    <p>Optimized and lightweight design</p>
</div>

<div class="card hidden">
    <h2>Modern</h2>
    <p>Uses latest UI trends like glassmorphism</p>
</div>

<div class="card hidden">
    <h2>Responsive</h2>
    <p>Works perfectly on all devices</p>
</div>

<footer>
    <p>© 2026 GlassUI Website</p>
</footer>

<script>
// SCROLL ANIMATION
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

document.querySelectorAll('.hidden').forEach(el => observer.observe(el));
</script>

</body>
</html>
