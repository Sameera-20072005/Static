<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Static Website</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

html {
    scroll-behavior: smooth;
}

/* NAVBAR */
header {
    background: #222;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
}

.logo {
    color: white;
    font-size: 22px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    gap: 20px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #00f2fe;
}

/* HAMBURGER */
.menu-toggle {
    display: none;
    font-size: 26px;
    color: white;
    cursor: pointer;
}

/* HERO */
.hero {
    height: 100vh;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    padding: 20px;
}

.hero h1 {
    font-size: 40px;
}

/* SECTIONS */
section {
    padding: 80px 20px;
    text-align: center;
}

/* ANIMATION */
.hidden {
    opacity: 0;
    transform: translateY(40px);
    transition: all 0.8s ease;
}

.show {
    opacity: 1;
    transform: translateY(0);
}

/* FOOTER */
footer {
    background: #222;
    color: white;
    padding: 20px;
}

/* RESPONSIVE */
@media (max-width: 768px) {

    .nav-links {
        position: absolute;
        right: 0;
        top: 60px;
        background: #222;
        flex-direction: column;
        width: 100%;
        text-align: center;
        display: none;
    }

    .nav-links.active {
        display: flex;
    }

    .menu-toggle {
        display: block;
    }
}
</style>
</head>

<body>

<header>
    <nav>
        <div class="logo">MySite</div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <div class="nav-links" id="navLinks">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>
</header>

<!-- HERO -->
<div class="hero" id="home">
    <div class="hidden">
        <h1>Welcome to My Website</h1>
        <p>Modern UI with Animations</p>
    </div>
</div>

<!-- ABOUT -->
<section id="about" class="hidden">
    <h2>About</h2>
    <p>This website includes animations and responsive design.</p>
</section>

<!-- SERVICES -->
<section id="services" class="hidden">
    <h2>Services</h2>
    <p>Web Development, UI/UX Design, Deployment</p>
</section>

<!-- CONTACT -->
<section id="contact" class="hidden">
    <h2>Contact</h2>
    <p>Email: example@email.com</p>
</section>

<footer>
    <p>© 2026 MySite</p>
</footer>

<script>
// TOGGLE MENU
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}

// SCROLL ANIMATION
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

document.querySelectorAll('.hidden').forEach(el => observer.observe(el));
</script>

</body>
</html>
