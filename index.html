<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* BACKGROUND */
body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
    background-size: 400% 400%;
    animation: bg 10s ease infinite;
}

@keyframes bg {
    0% {background-position: 0%}
    50% {background-position: 100%}
    100% {background-position: 0%}
}

/* NAVBAR */
header {
    position: fixed;
    width: 100%;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    z-index: 1000;
}

nav {
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
}

.logo {
    font-weight: bold;
    font-size: 24px;
    color: #ff4b7d;
}

.nav-links {
    display: flex;
    gap: 20px;
}

.nav-links a {
    text-decoration: none;
    color: #333;
}

.menu-toggle {
    display: none;
    font-size: 26px;
    cursor: pointer;
}

/* HERO */
.hero {
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1521334884684-d80222895322') center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

.hero h1 {
    font-size: 50px;
}

.btn {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 30px;
    border: none;
    background: #ff4b7d;
    color: white;
    cursor: pointer;
}

/* SECTIONS */
section {
    padding: 80px 20px;
    text-align: center;
}

h2 {
    color: white;
    margin-bottom: 30px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

/* CARD */
.card {
    background: white;
    border-radius: 15px;
    padding: 15px;
    transition: 0.3s;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

.card:hover {
    transform: translateY(-10px);
}

/* ANIMATION */
.hidden {
    opacity: 0;
    transform: translateY(40px);
    transition: 1s;
}

.show {
    opacity: 1;
    transform: translateY(0);
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    color: white;
}

/* MOBILE */
@media (max-width: 768px) {
    .nav-links {
        position: absolute;
        top: 60px;
        right: 0;
        background: white;
        width: 100%;
        flex-direction: column;
        display: none;
    }

    .nav-links.active {
        display: flex;
    }

    .menu-toggle {
        display: block;
    }

    .hero h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>
    <nav>
        <div class="logo">Boutique</div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <div class="nav-links" id="navLinks">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Collection</a>
            <a href="#">Contact</a>
        </div>
    </nav>
</header>

<!-- HERO -->
<div class="hero">
    <div class="hidden">
        <h1>Trendy Boutique Collection</h1>
        <p>Style that speaks for you</p>
        <button class="btn">Shop Now</button>
    </div>
</div>

<!-- CATEGORY -->
<section>
    <h2>Shop by Category</h2>
    <div class="grid">
        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b">
            <h3>Dresses</h3>
        </div>
        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3">
            <h3>Bags</h3>
        </div>
        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
            <h3>Shoes</h3>
        </div>
        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552">
            <h3>Accessories</h3>
        </div>
    </div>
</section>

<!-- PRODUCTS -->
<section>
    <h2>Featured Products</h2>
    <div class="grid">
        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1495121605193-b116b5b09a2a">
            <h3>Floral Dress</h3>
            <p>$29.99</p>
        </div>
        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3">
            <h3>Handbag</h3>
            <p>$49.99</p>
        </div>
        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
            <h3>Heels</h3>
            <p>$39.99</p>
        </div>
        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1518546305927-5a555bb7020d">
            <h3>Watch</h3>
            <p>$59.99</p>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 Boutique Store</p>
</footer>

<script>
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}

const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

document.querySelectorAll('.hidden').forEach(el => observer.observe(el));
</script>

</body>
</html>
