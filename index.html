<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* COLORFUL BACKGROUND */
body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #a18cd1);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    color: #333;
}

@keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* NAVBAR */
header {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    position: fixed;
    width: 100%;
    z-index: 1000;
}

nav {
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #ff4b7d;
}

.nav-links {
    display: flex;
    gap: 20px;
}

.nav-links a {
    text-decoration: none;
    color: #333;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #ff4b7d;
}

/* MOBILE MENU */
.menu-toggle {
    display: none;
    font-size: 26px;
    cursor: pointer;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.hero h1 {
    font-size: 48px;
    color: #fff;
}

.hero p {
    margin-top: 10px;
    color: #fff;
}

/* BUTTON */
.btn {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 30px;
    border: none;
    background: #ff4b7d;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
}

/* PRODUCTS */
.products {
    padding: 80px 20px;
    text-align: center;
}

.products h2 {
    margin-bottom: 40px;
    color: #fff;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 15px;
    transition: 0.3s;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

.card:hover {
    transform: translateY(-10px);
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    color: white;
}

/* ANIMATION */
.hidden {
    opacity: 0;
    transform: translateY(40px);
    transition: 1s;
}

.show {
    opacity: 1;
    transform: translateY(0);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .nav-links {
        position: absolute;
        top: 60px;
        right: 0;
        background: white;
        width: 100%;
        flex-direction: column;
        display: none;
        text-align: center;
    }

    .nav-links.active {
        display: flex;
    }

    .menu-toggle {
        display: block;
    }

    .hero h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<header>
    <nav>
        <div class="logo">Boutique</div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <div class="nav-links" id="navLinks">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Collection</a>
            <a href="#">Contact</a>
        </div>
    </nav>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hidden">
        <h1>Trendy Boutique Collection</h1>
        <p>Style that speaks for you</p>
        <button class="btn">Shop Now</button>
    </div>
</section>

<!-- PRODUCTS -->
<section class="products">
    <h2>Featured Products</h2>

    <div class="product-grid">
        <div class="card hidden">
            <img src="https://via.placeholder.com/300" alt="">
            <h3>Floral Dress</h3>
            <p>$29.99</p>
        </div>

        <div class="card hidden">
            <img src="https://via.placeholder.com/300" alt="">
            <h3>Stylish Handbag</h3>
            <p>$49.99</p>
        </div>

        <div class="card hidden">
            <img src="https://via.placeholder.com/300" alt="">
            <h3>Summer Heels</h3>
            <p>$39.99</p>
        </div>

        <div class="card hidden">
            <img src="https://via.placeholder.com/300" alt="">
            <h3>Elegant Watch</h3>
            <p>$59.99</p>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 Boutique Store</p>
</footer>

<script>
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}

// Scroll Animation
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

document.querySelectorAll('.hidden').forEach(el => observer.observe(el));
</script>

</body>
</html>
